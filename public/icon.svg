<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#161b2e"/>
      <stop offset="60%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>

    <!-- Gold Foil Metallic Linear Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="25%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#dfa92c"/>
      <stop offset="75%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#996f14"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e4f0d"/>
      <stop offset="35%" stop-color="#b8891f"/>
      <stop offset="70%" stop-color="#efc85a"/>
      <stop offset="100%" stop-color="#ffeeb8"/>
    </linearGradient>

    <linearGradient id="velvetCap" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4a154b"/>
      <stop offset="50%" stop-color="#23082b"/>
      <stop offset="100%" stop-color="#0e0414"/>
    </linearGradient>

    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="40%" stop-color="#e61c36"/>
      <stop offset="100%" stop-color="#6b0512"/>
    </linearGradient>

    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3e9"/>
      <stop offset="40%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#002b4d"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="goldShine" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Royal Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Filigree Halo Rings -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldLight)" stroke-width="2" opacity="0.4" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldDark)" stroke-width="1.5" opacity="0.65"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#d4af37" stroke-width="0.75" opacity="0.25"/>

  <!-- Ambient Golden Backlight Aura -->
  <circle cx="256" cy="250" r="140" fill="#ffd56b" opacity="0.12" filter="url(#royalGlow)"/>

  <!-- Chessboard Altar Stepped Base Pedestal under Crown -->
  <g filter="url(#goldShine)">
    <polygon points="120,388 392,388 376,412 136,412" fill="url(#goldDark)" opacity="0.75"/>
    <polygon points="104,412 408,412 396,428 116,428" fill="url(#goldLight)" opacity="0.85"/>
    <rect x="92" y="428" width="328" height="12" rx="4" fill="url(#goldDark)"/>
  </g>

  <!-- Crown Velvet Cap Interior Dome -->
  <path d="M152,364 C150,270 200,200 256,192 C312,200 362,270 360,364 Z" fill="url(#velvetCap)"/>

  <!-- Velvet Cap Fold Creases -->
  <path d="M256,192 C230,260 210,320 196,364" fill="none" stroke="#120318" stroke-width="4" opacity="0.8"/>
  <path d="M256,192 C282,260 302,320 316,364" fill="none" stroke="#120318" stroke-width="4" opacity="0.8"/>

  <!-- 3D Sculpted Golden Crown Structure -->
  <g filter="url(#goldShine)">
    <!-- Rear Crown Arches -->
    <path d="M256,160 C210,160 170,240 162,352" fill="none" stroke="url(#goldDark)" stroke-width="14" stroke-linecap="round"/>
    <path d="M256,160 C302,160 342,240 350,352" fill="none" stroke="url(#goldDark)" stroke-width="14" stroke-linecap="round"/>

    <!-- Front Crown Golden Arches (Sweeping Curves with Bevels) -->
    <path d="M256,160 C220,175 168,260 156,364" fill="none" stroke="url(#goldLight)" stroke-width="15" stroke-linecap="round"/>
    <path d="M256,160 C292,175 344,260 356,364" fill="none" stroke="url(#goldLight)" stroke-width="15" stroke-linecap="round"/>
    <path d="M256,160 L256,364" fill="none" stroke="url(#goldLight)" stroke-width="16" stroke-linecap="round"/>

    <!-- Crown Diadem Rim Base (Curved 3D Band) -->
    <path d="M136,364 Q256,396 376,364 L378,382 Q256,414 134,382 Z" fill="url(#goldLight)"/>
    <path d="M134,382 Q256,414 378,382 L380,392 Q256,424 132,392 Z" fill="url(#goldDark)"/>

    <!-- Diadem Filigree & Embossed Gold Beads -->
    <circle cx="160" cy="374" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="196" cy="380" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="256" cy="386" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="316" cy="380" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="352" cy="374" r="5" fill="#ffffff" opacity="0.7"/>

    <!-- Crown Pinnacles (Fleur-de-Lis Points) -->
    <!-- Center Pinnacle -->
    <path d="M256,270 C242,284 236,310 244,360 L268,360 C276,310 270,284 256,270 Z" fill="url(#goldLight)"/>
    <circle cx="256" cy="265" r="9" fill="url(#goldLight)"/>

    <!-- Left Pinnacle -->
    <path d="M180,296 C168,310 166,334 176,366 L198,366 C204,334 194,310 180,296 Z" fill="url(#goldLight)"/>
    <circle cx="178" cy="292" r="8" fill="url(#goldLight)"/>

    <!-- Right Pinnacle -->
    <path d="M332,296 C318,310 308,334 314,366 L336,366 C346,334 344,310 332,296 Z" fill="url(#goldLight)"/>
    <circle cx="334" cy="292" r="8" fill="url(#goldLight)"/>

    <!-- Far Left & Right Mini Horns -->
    <path d="M138,332 C132,342 134,354 138,366 L152,366 C150,352 146,342 138,332 Z" fill="url(#goldDark)"/>
    <circle cx="137" cy="328" r="6" fill="url(#goldLight)"/>

    <path d="M374,332 C380,342 378,354 374,366 L360,366 C362,352 366,342 374,332 Z" fill="url(#goldDark)"/>
    <circle cx="375" cy="328" r="6" fill="url(#goldLight)"/>

    <!-- Top Orb (Monde) -->
    <ellipse cx="256" cy="154" rx="19" ry="17" fill="url(#goldLight)"/>
    <ellipse cx="256" cy="154" rx="14" ry="12" fill="url(#goldDark)"/>
    <ellipse cx="252" cy="150" rx="5" ry="3" fill="#ffffff" opacity="0.6"/>

    <!-- The Grand King's Cross Pattée Finial -->
    <g id="crownCross">
      <!-- Cross Center Diamond -->
      <polygon points="256,128 264,136 256,144 248,136" fill="url(#goldLight)"/>
      
      <!-- Top Arm of Cross -->
      <path d="M251,128 L238,82 L274,82 L261,128 Z" fill="url(#goldLight)"/>
      <polygon points="240,84 256,92 272,84 256,76" fill="#fffbe8"/>

      <!-- Bottom Arm of Cross -->
      <path d="M251,144 L244,152 L268,152 L261,144 Z" fill="url(#goldDark)"/>

      <!-- Left Arm of Cross -->
      <path d="M248,131 L202,118 L202,154 L248,141 Z" fill="url(#goldLight)"/>
      <polygon points="204,120 212,136 204,152 196,136" fill="#fffbe8"/>

      <!-- Right Arm of Cross -->
      <path d="M264,131 L310,118 L310,154 L264,141 Z" fill="url(#goldLight)"/>
      <polygon points="308,120 300,136 308,152 316,136" fill="#fffbe8"/>

      <!-- Cross Center Ruby Jewel -->
      <circle cx="256" cy="136" r="6" fill="url(#rubyGrad)"/>
      <circle cx="254" cy="134" r="2" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Embedded Diadem Jewels -->
    <!-- Center Royal Ruby -->
    <ellipse cx="256" cy="386" rx="10" ry="12" fill="url(#rubyGrad)"/>
    <ellipse cx="254" cy="383" rx="4" ry="4" fill="#ffffff" opacity="0.85"/>

    <!-- Flanking Sapphires -->
    <ellipse cx="214" cy="383" rx="8" ry="9" fill="url(#sapphireGrad)"/>
    <ellipse cx="212" cy="381" rx="3" ry="3" fill="#ffffff" opacity="0.85"/>

    <ellipse cx="298" cy="383" rx="8" ry="9" fill="url(#sapphireGrad)"/>
    <ellipse cx="296" cy="381" rx="3" ry="3" fill="#ffffff" opacity="0.85"/>

    <!-- Outer Rubies -->
    <ellipse cx="176" cy="376" rx="7" ry="8" fill="url(#rubyGrad)"/>
    <ellipse cx="174" cy="374" rx="2.5" ry="2.5" fill="#ffffff" opacity="0.85"/>

    <ellipse cx="336" cy="376" rx="7" ry="8" fill="url(#rubyGrad)"/>
    <ellipse cx="334" cy="374" rx="2.5" ry="2.5" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Crown Golden Specular Sparkles -->
  <polygon points="256,66 258,74 266,76 258,78 256,86 254,78 246,76 254,74" fill="#ffffff" opacity="0.9"/>
  <polygon points="346,290 347,294 351,295 347,296 346,300 345,296 341,295 345,294" fill="#ffffff" opacity="0.85"/>
  <polygon points="166,290 167,294 171,295 167,296 166,300 165,296 161,295 165,294" fill="#ffffff" opacity="0.85"/>

  <!-- Brand Typography "OrzuKod 3D" -->
  <text x="256" y="472" font-family="'Cinzel', 'Cinzel Decorative', 'Trajan Pro', 'Cinzel Decorative', 'Georgia', serif" font-size="30" font-weight="800" letter-spacing="4" fill="url(#goldLight)" text-anchor="middle" filter="url(#goldShine)">ORZUKOD 3D</text>
</svg>
