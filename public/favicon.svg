    <ellipse cx="214" cy="383" rx="8" ry="9" fill="url(#sapphireGrad)"/>
    <ellipse cx="298" cy="383" rx="8" ry="9" fill="url(#sapphireGrad)"/>
  </g>

  <polygon points="256,66 258,74 266,76 258,78 256,86 254,78 246,76 254,74" fill="#ffffff" opacity="0.9"/>
  <text x="256" y="472" font-family="'Cinzel', 'Cinzel Decorative', 'Trajan Pro', serif" font-size="30" font-weight="800" letter-spacing="4" fill="url(#goldLight)" text-anchor="middle" filter="url(#goldShine)">ORZUKOD 3D</text>
</svg>
